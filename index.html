<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRAL VIDEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{background:#111;padding:18px;text-align:center;border-bottom:1px solid #c99b35}
header h1{margin:0;color:#e7bd55;letter-spacing:2px}
nav{display:flex;gap:8px;padding:12px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 15px;background:#d5a83f;color:#111;font-weight:bold;cursor:pointer}
input{padding:12px;border:1px solid #555;background:#171717;color:white;border-radius:8px;width:100%;margin:7px 0}
main{padding:15px;max-width:1000px;margin:auto}
#search{margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.video{background:#171717;border:1px solid #333;border-radius:10px;overflow:hidden}
.video video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.video h3{font-size:14px;padding:0 10px;overflow-wrap:anywhere}
.video button{margin:0 10px 10px}
.panel{background:#151515;border:1px solid #333;padding:16px;border-radius:12px;margin:15px 0}
.hidden{display:none}
.gold{color:#e7bd55}
.small{color:#aaa;font-size:13px}
#status{color:#e7bd55;margin:10px 0}
</style>
</head>
<body>
<header>
<h1>▶ VIRAL VIDEO</h1>
<p class="small">Watch • Discover • Enjoy</p>
</header>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('admin')">Admin Panel</button>
</nav>

<main>
<section id="home">
<h2 class="gold">All Videos</h2>
<input id="search" placeholder="ভিডিও খুঁজুন..." oninput="filterVideos()">
<p>মোট ভিডিও: <b id="count">0</b></p>
<div class="grid" id="videos">
<p class="small">ভিডিও লোড হচ্ছে...</p>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2 class="gold">Admin Login</h2>
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
<p id="loginStatus" class="small"></p>
</div>

<div id="adminArea" class="hidden">
<div class="panel">
<h2 class="gold">Upload Video</h2>
<input id="title" placeholder="ভিডিওর নাম">
<input id="file" type="file" accept="video/*">
<button onclick="uploadVideo()">Upload Video</button>
<p id="status"></p>
<progress id="progress" value="0" max="100" style="width:100%"></progress>
</div>

<div class="panel">
<h2 class="gold">Manage Videos</h2>
<p>মোট ভিডিও: <b id="adminCount">0</b></p>
<div id="manage"></div>
</div>
</div>
</section>
</main>

<script>
/*
Cloudflare Worker Deploy করার পর এখানে তার URL বসাবে।
উদাহরণ: https://viral-video-api.username.workers.dev
*/
const API_BASE = "https://viral-video-api.nasimserkan.workers.dev";

let adminPassword = "";
let allVideos = [];

function showPage(page){
 document.getElementById("home").classList.toggle("hidden",page!=="home");
 document.getElementById("admin").classList.toggle("hidden",page!=="admin");
}

async function api(path,options={}){
 if(API_BASE.includes("PASTE_")) throw new Error("আগে Cloudflare Worker URL বসাতে হবে");
 const response=await fetch(API_BASE+path,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 const data=await response.json();
 if(!response.ok) throw new Error(data.error||"Request failed");
 return data;
}

async function loadVideos(){
 const box=document.getElementById("videos");
 try{
  const data=await api("/api/videos");
  allVideos=data.videos||[];
  document.getElementById("count").textContent=allVideos.length;
  document.getElementById("adminCount").textContent=allVideos.length;
  renderVideos(allVideos);
  renderManage();
 }catch(error){
  box.innerHTML='<p class="small">ভিডিও লোড করা যাচ্ছে না। Worker URL ও Deploy সেটিংস পরীক্ষা করো।</p>';
  document.getElementById("count").textContent="0";
 }
}

function renderVideos(items){
 const box=document.getElementById("videos");
 if(!items.length){
  box.innerHTML='<p class="small">এখনো কোনো ভিডিও আপলোড করা হয়নি।</p>';
  return;
 }
 box.innerHTML="";
 items.forEach(v=>{
  const card=document.createElement("div");
  card.className="video";
  const video=document.createElement("video");
  video.src=v.url;
  video.controls=true;
  video.preload="metadata";
  video.playsInline=true;
  const heading=document.createElement("h3");
  heading.textContent=v.title||"Untitled Video";
  card.append(video,heading);
  box.append(card);
 });
}

function filterVideos(){
 const q=document.getElementById("search").value.toLowerCase();
 renderVideos(allVideos.filter(v=>(v.title||"").toLowerCase().includes(q)));
}

async function login(){
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginStatus");
 try{
  await api("/api/admin-check",{
   method:"POST",
   headers:{"X-Admin-Password":password},
   body:JSON.stringify({})
  });
  adminPassword=password;
  document.getElementById("adminArea").classList.remove("hidden");
  msg.textContent="Login successful";
  renderManage();
 }catch(e){
  msg.textContent="Login failed: "+e.message;
 }
}

async function uploadVideo(){
 const title=document.getElementById("title").value.trim();
 const file=document.getElementById("file").files[0];
 const status=document.getElementById("status");
 const progress=document.getElementById("progress");

 if(!adminPassword){status.textContent="আগে Admin Login করো";return}
 if(!title||!file){status.textContent="ভিডিওর নাম ও ফাইল দাও";return}
 if(!file.type.startsWith("video/")){status.textContent="শুধু ভিডিও ফাইল দেওয়া যাবে";return}
 if(title.includes("|")||title.includes("=")){status.textContent="নামের মধ্যে | অথবা = ব্যবহার কোরো না";return}

 status.textContent="Upload প্রস্তুত হচ্ছে...";
 progress.value=0;

 try{
  const signed=await api("/api/sign",{
   method:"POST",
   headers:{"X-Admin-Password":adminPassword},
   body:JSON.stringify({title})
  });

  const form=new FormData();
  form.append("file",file);
  form.append("timestamp",signed.timestamp);
  form.append("upload_preset",signed.upload_preset);
  form.append("context",signed.context);
  form.append("api_key",signed.api_key);
  form.append("signature",signed.signature);

  const xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.cloudinary.com/v1_1/ntzhwwnt/video/upload");

  xhr.upload.onprogress=e=>{
   if(e.lengthComputable) progress.value=Math.round(e.loaded/e.total*100);
  };

  xhr.onload=async()=>{
   let result={};
   try{result=JSON.parse(xhr.responseText)}catch(e){}
   if(xhr.status>=200&&xhr.status<300){
    status.textContent="ভিডিও সফলভাবে আপলোড হয়েছে!";
    document.getElementById("title").value="";
    document.getElementById("file").value="";
    await loadVideos();
   }else{
    status.textContent="Upload error: "+(result.error?.message||"Cloudinary error");
   }
  };

  xhr.onerror=()=>status.textContent="Network error";
  xhr.send(form);
 }catch(e){
  status.textContent="Error: "+e.message;
 }
}

function renderManage(){
 const box=document.getElementById("manage");
 box.innerHTML="";
 allVideos.forEach(v=>{
  const row=document.createElement("div");
  row.style.cssText="padding:12px 0;border-bottom:1px solid #333";
  const name=document.createElement("span");
  name.textContent=v.title||v.public_id;
  const del=document.createElement("button");
  del.textContent="Delete";
  del.style.cssText="float:right;background:#b63b35;color:white";
  del.onclick=()=>deleteVideo(v.public_id);
  row.append(name,del);
  box.append(row);
 });
}

async function deleteVideo(publicId){
 if(!adminPassword)return alert("আগে Login করো");
 if(!confirm("এই ভিডিওটি স্থায়ীভাবে ডিলিট করবে?"))return;
 try{
  await api("/api/videos",{
   method:"DELETE",
   headers:{"X-Admin-Password":adminPassword},
   body:JSON.stringify({public_id:publicId})
  });
  alert("ভিডিও ডিলিট হয়েছে");
  await loadVideos();
 }catch(e){
  alert("Delete error: "+e.message);
 }
}

loadVideos();
</script>
</body>
</html>
