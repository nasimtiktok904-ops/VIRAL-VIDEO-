<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ভিডিও স্ট্রিম — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131822;
      --surface-2: #1a2130;
      --border: #263042;
      --text: #f3f6fb;
      --muted: #8e9bb0;
      --accent: #2ea6ff;
      --accent-hover: #1b8ee0;
      --success: #22c55e;
      --danger: #ef4444;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }


    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 36px;
    }


    /* টপ বার */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 14, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2ea6ff, #6366f1);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 14px rgba(46, 166, 255, 0.35);
    }


    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }


    .brand-text p {
      font-size: 11px;
      color: var(--muted);
    }


    .admin-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }


    .admin-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }


    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px;
    }


    /* মেইন ভিডিও প্লেয়ার */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }


    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }


    .video-wrapper video,
    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }


    .player-details {
      padding: 14px 16px;
    }


    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }


    .live-badge {
      background: rgba(46, 166, 255, 0.14);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }


    .player-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
    }


    .player-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }


    /* ভিডিও লিস্ট সেকশন */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }


    .section-head h2 {
      font-size: 15px;
      font-weight: 700;
    }


    .count-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
    }


    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }


    @media (min-width: 580px) {
      .video-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    .v-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }


    .v-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }


    .v-card.active {
      border-color: var(--success);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.3);
    }


    .thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #18202c;
    }


    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    .play-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent 55%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 10px;
    }


    .type-tag {
      background: rgba(11, 14, 20, 0.85);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
    }


    .v-body {
      padding: 12px;
    }


    .v-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.35;
    }


    .v-desc {
      font-size: 12px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }


    .v-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }


    .del-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }


    /* অ্যাডমিন মডাল */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }


    @media (min-width: 560px) {
      .modal-backdrop {
        align-items: center;
      }
    }


    .modal-backdrop.open {
      display: flex;
    }


    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.2s ease;
    }


    @keyframes slideUp {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }


    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }


    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .modal-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(46, 166, 255, 0.15);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 16px;
    }


    .modal-header h3 {
      font-size: 15px;
      font-weight: 700;
    }


    .modal-header p {
      font-size: 11px;
      color: var(--muted);
    }


    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }


    .field {
      margin-bottom: 12px;
    }


    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }


    .field input,
    .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }


    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }


    .pin-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 18px !important;
      font-weight: 700;
    }


    .btn-full {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }


    .btn-full:hover {
      background: var(--accent-hover);
    }


    .btn-secondary {
      width: 100%;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }


    .status-msg {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }


    .status-msg.err { color: var(--danger); }
    .status-msg.ok { color: var(--success); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">▶</div>
      <div class="brand-text">
        <h1>ভিডিও স্ট্রিম</h1>
        <p id="welcomeText">টেলিগ্রাম ভিডিও হাব</p>
      </div>
    </div>
    <button class="admin-btn" id="openAdminBtn">⚙ অ্যাডমিন</button>
  </header>


  <main class="container">
    <!-- মেইন ভিডিও প্লেয়ার -->
    <section class="player-card">
      <div class="video-wrapper" id="playerStage"></div>
      <div class="player-details">
        <div class="badge-row">
          <span class="live-badge" id="playerFormat">HD STREAM</span>
        </div>
        <div class="player-title" id="playerTitle">ভিডিও লোড হচ্ছে...</div>
        <div class="player-desc" id="playerDesc"></div>
      </div>
    </section>


    <!-- ভিডিও তালিকা -->
    <div class="section-head">
      <h2>সব ভিডিও</h2>
      <span class="count-pill" id="totalCount">0 টি ভিডিও</span>
    </div>


    <div class="video-grid" id="videoGrid"></div>
  </main>


  <!-- অ্যাডমিন কন্ট্রোল প্যানেল মডাল -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-icon">⚙</div>
          <div>
            <h3>অ্যাডমিন কন্ট্রোল প্যানেল</h3>
            <p>নতুন ভিডিও যুক্ত বা পরিবর্তন করুন</p>
          </div>
        </div>
        <button class="close-btn" id="closeAdminBtn">✕</button>
      </div>


      <!-- লক স্ক্রিন (পিন হিন্ট ছাড়া) -->
      <div id="pinStep">
        <div class="field">
          <label for="pinField">অ্যাডমিন পিন দিন</label>
          <input type="password" id="pinField" class="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" />
        </div>
        <button type="button" class="btn-full" id="unlockBtn">প্যানেল আনলক করুন</button>
        <div class="status-msg" id="pinStatus"></div>
      </div>


      <!-- আনলক হওয়ার পর ভিডিও যুক্ত করার ফর্ম -->
      <form id="videoForm" style="display:none;">
        <div class="field">
          <label for="vTitle">ভিডিওর শিরোনাম *</label>
          <input type="text" id="vTitle" placeholder="ভিডিওর নাম লিখুন" required />
          </div>
        <div class="field">
          <label for="vUrl">ভিডিও লিংক (YouTube বা সরাসরি .mp4 লিংক) *</label>
          <input type="url" id="vUrl" placeholder="https://..." required />
        </div>
        <div class="field">
          <label for="vThumb">থাম্বনেইল ছবির লিংক (ঐচ্ছিক)</label>
          <input type="url" id="vThumb" placeholder="https://..." />
        </div>
        <div class="field">
          <label for="vDesc">সংক্ষিপ্ত বিবরণ</label>
          <textarea id="vDesc" rows="2" placeholder="ভিডিও সম্পর্কে কিছু লিখুন..."></textarea>
        </div>
        <button type="submit" class="btn-full">ভিডিও প্রকাশ করুন</button>
        <button type="button" class="btn-secondary" id="lockBtn">প্যানেল লক করুন</button>
        <div class="status-msg ok" id="formStatus"></div>
      </form>
    </div>
  </div>


  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        document.getElementById("welcomeText").textContent = `স্বাগতম, ${user.first_name}`;
      }
    }


    // ডিফল্ট পিন "1234" এর SHA-256 হ্যাশ (প্লেইন পিন লেখা নেই)
    const ADMIN_PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
    const STORAGE_KEY = "tg_video_stream_items_v2";


    // এখানে আপনি কোডের ভেতরেও স্থায়ী ভিডিও লিংক বসিয়ে রাখতে পারেন
    const INITIAL_VIDEOS = [
      {
        id: "v1",
        title: "Big Buck Bunny — ফুল এইচডি অ্যানিমেশন মুভি ক্লিপ",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        thumb: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg",
        desc: "সরাসরি হাই-স্পিড MP4 স্ট্রিমিং ভিডিও। টেলিগ্রাম মিনি অ্যাপ থেকেই স্মুথলি প্লে হবে।"
      },
      {
        id: "v2",
        title: "Elephants Dream — অফিসিয়াল শোকেস",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
        thumb: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ElephantsDream.jpg",
        desc: "ওপেন মুভি প্রজেক্টের ফুল রেজোলিউশন ভিডিও।"
      }
    ];


    let videos = getStoredVideos();
    let currentId = videos[0]?.id || null;
    let unlocked = false;


    function getStoredVideos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [...INITIAL_VIDEOS];
        const list = JSON.parse(saved);
        return Array.isArray(list) && list.length ? list : [...INITIAL_VIDEOS];
      } catch {
        return [...INITIAL_VIDEOS];
      }
    }


    function persistVideos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
    }


    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }


    function parseYouTube(url) {
      try {
        const parsed = new URL(url);
        let vid = "";
        if (parsed.hostname.includes("youtu.be")) {
          vid = parsed.pathname.slice(1);
        } else if (parsed.hostname.includes("youtube.com")) {
          if (parsed.pathname.startsWith("/shorts/")) {
            vid = parsed.pathname.split("/shorts/")[1]?.split("/")[0] || "";
          } else {
            vid = parsed.searchParams.get("v") || "";
          }
        }
        return vid ? `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0` : null;
      } catch {
        return null;
      }
    }


    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }


    function renderPlayer(video) {
      const stage = document.getElementById("playerStage");
      const title = document.getElementById("playerTitle");
      const desc = document.getElementById("playerDesc");
      const format = document.getElementById("playerFormat");

      if (!video) {
        stage.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#8e9bb0;">কোনো ভিডিও পাওয়া যায়নি</div>`;
        title.textContent = "ভিডিও নেই";
        desc.textContent = "";
        return;
      }

      title.textContent = video.title;
      desc.textContent = video.desc || "";

      const ytUrl = parseYouTube(video.url);
      if (ytUrl) {
        format.textContent = "YOUTUBE";
        stage.innerHTML = `<iframe src="${ytUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } else {
        format.textContent = "DIRECT MP4";
        stage.innerHTML = `<video src="${esc(video.url)}" poster="${esc(video.thumb)}" controls playsinline></video>`;
      }
    }


    function renderGrid() {
      const grid = document.getElementById("videoGrid");
      document.getElementById("totalCount").textContent = `${videos.length} টি ভিডিও`;

      const defaultThumb = "data:image/svg+xml;utf8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
          <rect width="640" height="360" fill="#18202c"/>
          <circle cx="320" cy="180" r="40" fill="#2ea6ff"/>
          <polygon points="308,162 308,198 340,180" fill="#ffffff"/>
        </svg>
      `);

      grid.innerHTML = videos.map((v) => {
        const active = v.id === currentId;
        const isYt = Boolean(parseYouTube(v.url));
        return `
          <div class="v-card ${active ? "active" : ""}" data-id="${v.id}">
            <div class="thumb-box">
              <img src="${esc(v.thumb) || defaultThumb}" alt="${esc(v.title)}" onerror="this.src='${defaultThumb}'" />
              <div class="play-overlay">
                <span class="type-tag">${isYt ? "YouTube" : "MP4"}</span>
              </div>
            </div>
            <div class="v-body">
              <div class="v-title">${esc(v.title)}</div>
              <div class="v-desc">${esc(v.desc)}</div>
              <div class="v-footer">
                <span>${active ? "● এখন চলছে" : "প্লে করুন"}</span>
                ${unlocked ? `<button type="button" class="del-btn" data-del="${v.id}">মুছুন</button>` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");

      grid.querySelectorAll(".v-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.classList.contains("del-btn")) return;
          currentId = card.dataset.id;
          const item = videos.find((x) => x.id === currentId);
          renderPlayer(item);
          renderGrid();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      grid.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const delId = btn.dataset.del;
          videos = videos.filter((x) => x.id !== delId);
          if (currentId === delId) {
            currentId = videos[0]?.id || null;
            renderPlayer(videos[0] || null);
          }
          persistVideos();
          renderGrid();
        });
      });
    }

    // মডাল কন্ট্রোল
    const modal = document.getElementById("adminModal");
    const pinStep = document.getElementById("pinStep");
    const videoForm = document.getElementById("videoForm");
    const pinField = document.getElementById("pinField");
    const pinStatus = document.getElementById("pinStatus");
    const formStatus = document.getElementById("formStatus");

    document.getElementById("openAdminBtn").addEventListener("click", () => {
      pinStatus.textContent = "";
      formStatus.textContent = "";
      pinField.value = "";
      pinStep.style.display = unlocked ? "none" : "block";
      videoForm.style.display = unlocked ? "block" : "none";
      modal.classList.add("open");
    });

    document.getElementById("closeAdminBtn").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    async function verifyPin() {
      const entered = pinField.value.trim();
      if (!entered) {
        pinStatus.className = "status-msg err";
        pinStatus.textContent = "পিন লিখুন";
        return;
      }
      const hashed = await sha256(entered);
      if (hashed === ADMIN_PIN_HASH) {
        unlocked = true;
        pinStep.style.display = "none";
        videoForm.style.display = "block";
        pinStatus.textContent = "";
        renderGrid();
      } else {
        pinStatus.className = "status-msg err";
        pinStatus.textContent = "ভুল পিন দেওয়া হয়েছে";
      }
    }

    document.getElementById("unlockBtn").addEventListener("click", verifyPin);
    pinField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    document.getElementById("lockBtn").addEventListener("click", () => {
      unlocked = false;
      modal.classList.remove("open");
      renderGrid();
    });

    videoForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("vTitle").value.trim();
      const url = document.getElementById("vUrl").value.trim();
      const thumb = document.getElementById("vThumb").value.trim();
      const desc = document.getElementById("vDesc").value.trim();

      if (!title || !url) return;

      const newItem = {
        id: "v-" + Date.now(),
        title,
        url,
        thumb,
        desc
      };

      videos.unshift(newItem);
      currentId = newItem.id;
      persistVideos();
      renderPlayer(newItem);
      renderGrid();
      videoForm.reset();
      formStatus.textContent = "ভিডিও সফলভাবে যুক্ত হয়েছে!";
    });


    // ইনিশিয়াল লোড
    renderPlayer(videos.find((x) => x.id === currentId) || videos[0] || null);
    renderGrid();
  </script>
</body>
</html>
